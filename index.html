<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>AWS Community Day Udaipur 2026 — Where Cloud Meets Community</title>
    <meta name="description" content="Official website for AWS Community Day Udaipur 2026. Join top cloud architects, developers, and AI researchers on February 28, 2026 at Geetanjali Institute of Technical Studies, Udaipur." />
    <meta name="theme-color" content="#030303" />
    <meta property="og:title" content="AWS Community Day Udaipur 2026" />

    <!-- Google Fonts: Geist by Vercel, Geist Mono, Outfit & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Outfit:wght@200..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />

    <!-- Permanent Dark Theme Setter -->
    <script>
      (function() {
        try {
          localStorage.setItem('aws-community-theme', 'dark');
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.classList.remove('light');
        document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
